<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Pages Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">From local code to public web</p>
        <h1 id="page-title">我的第一个公网发布项目</h1>
        <p class="intro">
          这个页面从本地代码开始，经过 Git 提交、GitHub 上传，最后由
          GitHub Pages 发布到公网。
        </p>
        <button id="celebrate-button" type="button">点我测试 JavaScript</button>
      </section>

      <section class="status" aria-live="polite">
        <h2>当前状态</h2>
        <p id="status-text">页面已加载，本地预览成功。</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
